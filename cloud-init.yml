#cloud-init

package_update: true
package_upgrade: true

packages:
  - python3
  - python3-pip
  - python3-venv
  - git
  - ufw
  - fail2ban
  - btop
  - curl

users:
  - default
  - name: botuser
    gecos: Discord Bot User
    groups: users, sudo
    shell: /bin/bash
    sudo: ALL=(ALL) NOPASSWD:ALL

runcmd:
  - mkdir -p /home/botuser/.ssh
  - cp /root/.ssh/authorized_keys /home/botuser/.ssh/authorized_keys || true
  - chown -R botuser:botuser /home/botuser/.ssh
  - chmod 700 /home/botuser/.ssh
  - chmod 600 /home/botuser/.ssh/authorized_keys || true

  - ufw allow OpenSSH
  - ufw --force enable

power_state:
  mode: reboot
  message: "Init complete. Rebooting."
  timeout: 10
  condition: true
